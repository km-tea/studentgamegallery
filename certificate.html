<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수료증</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#EEF2F8;color:#14213D;font-family:'Gowun Dodum','Noto Sans KR',system-ui,sans-serif;line-height:1.6}
.ui{max-width:1000px;margin:0 auto;padding:24px 20px 0}
.ui a{color:#2459D6}
.ui input{font:inherit;font-size:1.1rem;padding:8px 12px;border:1.5px solid #B8C3D9;border-radius:10px;width:14em;max-width:100%}
.ui button{font:inherit;padding:9px 18px;border-radius:10px;border:0;background:#2459D6;color:#fff;cursor:pointer}
.ui button:focus-visible,.ui input:focus-visible{outline:3px solid #FFC83D;outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.msg{background:#fff;border-radius:12px;padding:16px 18px;border:1.5px solid #D9E0EC}
.wrap{container-type:inline-size;max-width:1000px;margin:20px auto 40px;padding:0 20px}
.cert{aspect-ratio:297/210;background:#FFFEF9;border:1.2cqw solid #2459D6;outline:.4cqw solid #FFC83D;outline-offset:-2.4cqw;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4cqw;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.site{font-size:2cqw;color:#5B6784}
.cert h1{font-family:'Jua',sans-serif;font-weight:400;font-size:9cqw;margin:.8cqw 0 2cqw;letter-spacing:1cqw;line-height:1.1}
.who{font-family:'Jua',sans-serif;font-size:5.5cqw;border-bottom:.3cqw solid #14213D;padding:0 4cqw;line-height:1.3;min-width:30cqw}
.body{font-size:2.4cqw;max-width:72cqw;margin:3cqw 0 1.5cqw;line-height:1.7}
.meta{font-size:2cqw;color:#5B6784}
.seal{position:absolute;right:7cqw;bottom:6cqw;width:12cqw;height:12cqw;border-radius:50%;border:.5cqw double #2459D6;color:#2459D6;display:grid;place-items:center;font-family:'Jua',sans-serif;font-size:3.6cqw;transform:rotate(-12deg)}
[hidden]{display:none!important}
@page{size:A4 landscape;margin:0}
@media print{body{background:#fff}.ui{display:none}.wrap{max-width:none;width:297mm;margin:0;padding:0}.cert{width:297mm;height:210mm;aspect-ratio:auto}}
</style>
</head>
<body>
<div class="ui">
  <a href="./">← 갤러리로 돌아가기</a>
  <div id="status" class="msg" style="margin-top:12px">불러오는 중…</div>
  <div id="form" hidden>
    <div class="row"><input id="name" maxlength="20" placeholder="내 이름을 입력하세요" aria-label="이름"><button id="make">수료증 만들기</button><button id="print" hidden>인쇄 · PDF로 저장</button></div>
  </div>
</div>
<div class="wrap" id="wrap" hidden>
  <div class="cert">
    <div class="site" id="site"></div>
    <h1>수료증</h1>
    <div class="who" id="who"></div>
    <p class="body" id="body"></p>
    <div class="meta" id="meta"></div>
    <div class="seal" aria-hidden="true">수료</div>
  </div>
</div>
<script src="gallery-sdk.js"></script>
<script>
var SITE_NAME='우리 반 웹앱 갤러리'; // 수료증 맨 위에 표시되는 이름 (학교·학급 이름으로 바꿔도 돼요)
var $=function(i){return document.getElementById(i)};
var id=new URLSearchParams(location.search).get('id');
fetch('apps.json').then(function(r){return r.json()}).then(function(list){
  var app=list.filter(function(a){return a.id===id})[0];
  if(!app||!app.scoring){$('status').textContent='수료증을 만들 수 있는 앱을 찾지 못했어요.';return}
  var p=GallerySDK.getProgress(id)||{best:0,plays:0},s=app.scoring,u=s.unit||'점';
  if(!GallerySDK.isPassed(app)){
    $('status').textContent='아직 수료 조건을 채우지 못했어요. 「'+app.title+'」에서 '+s.pass+u+' 이상, '+(s.minPlays||1)+'회 이상 플레이하면 받을 수 있어요. (지금 최고 '+p.best+u+' · '+p.plays+'회)';return;
  }
  $('status').textContent='축하해요! 「'+app.title+'」 수료 조건을 달성했어요. 이름을 입력하고 수료증을 만들어 보세요.';
  $('form').hidden=false;$('name').focus();
  $('make').onclick=function(){
    var n=$('name').value.trim();if(!n){$('name').focus();return}
    $('site').textContent=SITE_NAME;
    $('who').textContent=n;
    $('body').textContent='위 학생은 「'+app.title+'」 활동에서 기준 '+s.pass+u+' 이상(최고 '+p.best+u+')을 달성하여 이 수료증을 수여합니다.';
    var d=new Date();
    $('meta').textContent=(app.maker?'만든 친구: '+app.maker+'  ·  ':'')+d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일';
    $('wrap').hidden=false;$('print').hidden=false;
    $('wrap').scrollIntoView({behavior:'smooth'});
  };
  $('name').onkeydown=function(e){if(e.key==='Enter')$('make').click()};
  $('print').onclick=function(){window.print()};
}).catch(function(){$('status').textContent='apps.json을 불러오지 못했어요. Netlify나 로컬 서버에서 열어 주세요.'});
</script>
</body>
</html>

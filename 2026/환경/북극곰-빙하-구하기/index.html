            font-family: 'Jua', 'Nunito', sans-serif;

            background-color: #0c192c;

            display: block;
            touch-action: none;

            background: rgba(15, 32, 67, 0.75);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.15);
        }
        /* Animated Water Gradient */
        .ocean-bg {
            background: linear-gradient(180deg, #0f2b48 0%, #07162c 100%);
        }
        /* Pulse Animation for Warning */
        @keyframes ice-warning {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .warning-pulse {
            animation: ice-warning 0.8s infinite;
        }
    </style>
<script src="/gallery-sdk.js"></script>

    <script>
        // Game Configuration & Engine Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Touch Drag Control States
        let mobileControlMode = 'BUTTONS'; // 'BUTTONS' or 'DRAG'
        let touchDragActive = false;
        let touchStartPos = { x: 0, y: 0 };
        let touchCurrentPos = { x: 0, y: 0 };
        let dragDir = { x: 0, y: 0 };

        // 터치 기기가 아니면 화면 버튼 숨김 (태블릿은 화면이 커도 버튼 표시)
        if (!window.matchMedia('(pointer: coarse)').matches) document.getElementById('touchControls').classList.add('hidden');

        // Mobile Control UI Handlers
        document.getElementById('ctrlButtons').addEventListener('click', () => {
            mobileControlMode = 'BUTTONS';
            document.getElementById('ctrlButtons').className = 'ctrl-btn py-1.5 px-3 rounded-xl border border-cyan-400 bg-cyan-500/30 text-cyan-200 font-bold text-xs transition';
            document.getElementById('ctrlTouchDrag').className = 'ctrl-btn py-1.5 px-3 rounded-xl border border-white/10 bg-slate-800/60 text-gray-300 font-bold text-xs transition';
            document.getElementById('touchControls').classList.remove('hidden');
        });

        document.getElementById('ctrlTouchDrag').addEventListener('click', () => {
            mobileControlMode = 'DRAG';
            document.getElementById('ctrlTouchDrag').className = 'ctrl-btn py-1.5 px-3 rounded-xl border border-cyan-400 bg-cyan-500/30 text-cyan-200 font-bold text-xs transition';
            document.getElementById('ctrlButtons').className = 'ctrl-btn py-1.5 px-3 rounded-xl border border-white/10 bg-slate-800/60 text-gray-300 font-bold text-xs transition';
            document.getElementById('touchControls').classList.add('hidden');
        });

        // Touch Canvas Drag Events
        canvas.addEventListener('pointerdown', (e) => {
            if (mobileControlMode !== 'DRAG' || gameState !== 'PLAYING') return;
            const rect = canvas.getBoundingClientRect();
            touchDragActive = true;
            touchStartPos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
            touchCurrentPos = { ...touchStartPos };
            dragDir = { x: 0, y: 0 };
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!touchDragActive || mobileControlMode !== 'DRAG') return;
            const rect = canvas.getBoundingClientRect();
            touchCurrentPos = { x: e.clientX - rect.left, y: e.clientY - rect.top };

            const dx = touchCurrentPos.x - touchStartPos.x;
            const dy = touchCurrentPos.y - touchStartPos.y;
            const dist = Math.hypot(dx, dy);

            if (dist > 5) {
                dragDir.x = dx / dist;
                dragDir.y = dy / dist;
            } else {
                dragDir = { x: 0, y: 0 };
            }
        });

        const stopTouchDrag = () => {
            touchDragActive = false;
            dragDir = { x: 0, y: 0 };
        };
        canvas.addEventListener('pointerup', stopTouchDrag);
        canvas.addEventListener('pointercancel', stopTouchDrag);
        canvas.addEventListener('pointerleave', stopTouchDrag);

        const GRID_ROWS = 10;
        const GRID_COLS = 12;
        let tileSize = 60;

        // 화면(태블릿 가로/세로)에 맞춰 게임 영역 크기 조절
        function fitStage(box, rw, rh, maxW) {
            document.body.style.minHeight = '0';
            document.body.style.height = window.innerHeight + 'px';
            var bs = getComputedStyle(document.body), others = 0;
            var padX = parseFloat(bs.paddingLeft) + parseFloat(bs.paddingRight);
            var padY = parseFloat(bs.paddingTop) + parseFloat(bs.paddingBottom);
            Array.prototype.forEach.call(document.body.children, function (el) {
                if (el === box || el.tagName === 'SCRIPT') return;
                var cs = getComputedStyle(el);
                if (cs.display === 'none' || cs.position === 'absolute' || cs.position === 'fixed') return;
                others += el.offsetHeight + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom);
            });
            var availH = window.innerHeight - padY - others - 2;
            var availW = document.body.clientWidth - padX;
            var w = Math.max(200, Math.min(maxW, availW, availH * rw / rh));
            box.style.width = w + 'px';
            box.style.height = (w * rh / rw) + 'px';
            box.style.maxHeight = 'none';
        }

        function resizeCanvas() {
            fitStage(canvas.parentElement, 4, 3, 896);
            const container = canvas.parentElement;
            const width = container.clientWidth;
            const height = container.clientHeight;
            
            canvas.width = width;
            canvas.height = height;
            
            tileSize = Math.min(width / GRID_COLS, height / GRID_ROWS);
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', function () { setTimeout(resizeCanvas, 200); });
        resizeCanvas();

        // Audio Effects Generator (Web Audio API)
        class SoundFX {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playTone(freq, duration, type = 'sine', gainVal = 0.1) {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {
                    console.log("Audio error:", e);
                }
            }
            collect() {
                this.playTone(523.25, 0.1); // C5
                setTimeout(() => this.playTone(659.25, 0.15), 80); // E5
            }
            iceRestore() {
                this.playTone(440, 0.1, 'triangle');
                setTimeout(() => this.playTone(880, 0.2, 'triangle'), 100);
            }
            splash() {
                this.playTone(150, 0.3, 'sawtooth', 0.2);
                this.playTone(80, 0.4, 'sine', 0.3);
            }
            crack() {
                this.playTone(200, 0.05, 'square', 0.05);
            }
            heatWarning() {
                this.playTone(300, 0.1, 'sawtooth', 0.05);
            }
        }
        const sound = new SoundFX();

        // Player Nickname Load / Save local
        let playerNickname = localStorage.getItem('polar_bear_nickname') || '';
        if (playerNickname) {
            document.getElementById('nicknameInput').value = playerNickname;
        }

        // Game State Variables
        let gameState = 'START'; // 'START', 'PLAYING', 'PAUSED', 'GAMEOVER'
        let score = 0;
        let elapsedTime = 0;
        let lastFrameTime = 0;
        let meltTimer = 0;
        let meltInterval = 1200; // Ice melt interval in ms (accelerates over time)

        // Key Inputs Track
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };

        window.addEventListener('keydown', (e) => {
            // Prevent space scroll or start if typing in input
            if (document.activeElement === document.getElementById('nicknameInput')) return;

            if (['w','a','s','d','W','A','S','D','ArrowUp','ArrowLeft','ArrowDown','ArrowRight'].includes(e.key)) {
                keys[e.key.toLowerCase()] = true;
                if (e.key.startsWith('Arrow')) keys[e.key] = true;
            }

        // Player Bear Factory / Class
        class Bear {
            constructor(id, color, furColor, is2P = false) {
                this.id = id;
                this.color = color;
                this.furColor = furColor;
                this.is2P = is2P;
                this.x = 0;
                this.y = 0;
                this.radius = 18;
                this.speed = 3.5;
                this.baseSpeed = 3.5;
                this.facingRight = true;
                this.speedBuffTimer = 0;
                this.alive = true;
            }

            reset(startX, startY, speed) {
                this.x = startX;
                this.y = startY;
                this.baseSpeed = speed;
                this.speed = speed;
                this.speedBuffTimer = 0;
                this.alive = true;
            }

            update(delta) {
                if (!this.alive) return;

                let dx = 0;
                let dy = 0;

                if (!this.is2P) {
                    if (mobileControlMode === 'DRAG' && touchDragActive) {
                        dx = dragDir.x;
                        dy = dragDir.y;
                        if (dx > 0.1) this.facingRight = true;
                        if (dx < -0.1) this.facingRight = false;
                    } else {
                        // 1P: WASD
                        if (keys.w) dy -= 1;
                        if (keys.s) dy += 1;
                        if (keys.a) { dx -= 1; this.facingRight = false; }
                        if (keys.d) { dx += 1; this.facingRight = true; }
                        if (dx !== 0 && dy !== 0) {
                            dx *= 0.7071;
                            dy *= 0.7071;
                        }
                    }
                } else {
                    // 2P: Arrow Keys
                    if (keys.ArrowUp) dy -= 1;
                    if (keys.ArrowDown) dy += 1;
                    if (keys.ArrowLeft) { dx -= 1; this.facingRight = false; }
                    if (keys.ArrowRight) { dx += 1; this.facingRight = true; }
                    if (dx !== 0 && dy !== 0) {
                        dx *= 0.7071;
                        dy *= 0.7071;
                    }
                }

                if (this.speedBuffTimer > 0) {
                    this.speedBuffTimer -= delta;
                    this.speed = this.baseSpeed * 1.5;
                } else {
                    this.speed = this.baseSpeed;
                }

                this.x += dx * this.speed * (delta / 16);
                this.y += dy * this.speed * (delta / 16);

                this.x = Math.max(10, Math.min(canvas.width - 10, this.x));
                this.y = Math.max(10, Math.min(canvas.height - 10, this.y));
            }

            draw() {
                if (!this.alive) return;

                ctx.save();
                ctx.translate(this.x, this.y);
                if (!this.facingRight) ctx.scale(-1, 1);

                // Bear Shadow
                ctx.beginPath();
                ctx.ellipse(0, 12, 14, 6, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 20, 50, 0.3)';
                ctx.fill();

                if (this.speedBuffTimer > 0) {
                    ctx.beginPath();
                    ctx.arc(0, 0, 22, 0, Math.PI * 2);
                    ctx.strokeStyle = '#38bdf8';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([4, 4]);
                    ctx.stroke();
                }

                // Bear Body
                ctx.beginPath();
                ctx.arc(0, 0, 16, 0, Math.PI * 2);
                ctx.fillStyle = this.furColor;
                ctx.fill();
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.stroke();

                // Ears
                ctx.beginPath();
                ctx.arc(-11, -11, 6, 0, Math.PI * 2);
                ctx.arc(11, -11, 6, 0, Math.PI * 2);
                ctx.fillStyle = this.furColor;
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(-11, -11, 3, 0, Math.PI * 2);
                ctx.arc(11, -11, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#f472b6';
                ctx.fill();

                // Eyes
                ctx.beginPath();
                ctx.arc(5, -4, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = this.furColor === '#ffffff' ? '#1e293b' : '#ffffff';
                ctx.fill();

                // Snout / Nose
                ctx.beginPath();
                ctx.ellipse(8, 2, 5, 4, 0, 0, Math.PI * 2);
                ctx.fillStyle = this.furColor === '#ffffff' ? '#f1f5f9' : '#52525b';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(10, 1, 2, 0, Math.PI * 2);
                ctx.fillStyle = '#0f172a';
                ctx.fill();

                // Cheeks
                ctx.beginPath();
                ctx.arc(3, 4, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(251, 113, 133, 0.5)';
                ctx.fill();

                ctx.restore();
            }
        }

        class HeatHazard {
            constructor(gridR, gridC, warningDuration = 2000) {
                this.gridR = gridR;
                this.gridC = gridC;
                this.timer = warningDuration;
                this.activeTimer = 1000;
                this.state = 'WARNING';
            }

            update(delta) {
                if (this.state === 'WARNING') {
                    this.timer -= delta;
                    if (this.timer <= 0) {
                        this.state = 'ACTIVE';
                        sound.heatWarning();
                    }
                } else if (this.state === 'ACTIVE') {
                    this.activeTimer -= delta;
                    if (this.activeTimer <= 0) {
                        this.state = 'EXPIRED';
                        if (iceGrid[this.gridR] && iceGrid[this.gridR][this.gridC]) {
                            iceGrid[this.gridR][this.gridC].state = 0;
                        }
                    }
                }
            }

            draw(offsetX, offsetY) {
                const x = offsetX + this.gridC * tileSize;
                const y = offsetY + this.gridR * tileSize;

                ctx.save();
                if (this.state === 'WARNING') {
                    ctx.fillStyle = 'rgba(239, 68, 68, 0.25)';
                    ctx.fillRect(x, y, tileSize, tileSize);
                    ctx.strokeStyle = '#ef4444';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x + 2, y + 2, tileSize - 4, tileSize - 4);

                    ctx.font = `${tileSize * 0.4}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('☀️', x + tileSize / 2, y + tileSize / 2);
                } else if (this.state === 'ACTIVE') {
                    ctx.fillStyle = 'rgba(220, 38, 38, 0.6)';
                    ctx.fillRect(x, y, tileSize, tileSize);

                    ctx.fillStyle = 'rgba(253, 224, 71, 0.8)';
                    ctx.beginPath();
                    ctx.arc(x + tileSize / 2, y + tileSize / 2, tileSize * 0.35, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        // Spawn Mechanics
        function spawnItem() {
            const validTiles = [];
            const offsetX = (canvas.width - GRID_COLS * tileSize) / 2;
            const offsetY = (canvas.height - GRID_ROWS * tileSize) / 2;

            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    if (iceGrid[r][c].state > 0) {
                        validTiles.push({ r, c });
                    }
                }
            }

            if (validTiles.length > 0) {
                const spot = validTiles[Math.floor(Math.random() * validTiles.length)];
                const x = offsetX + spot.c * tileSize + tileSize / 2;
                const y = offsetY + spot.r * tileSize + tileSize / 2;
                const type = Math.random() < 0.65 ? 'FISH' : 'ICE_CUBE';

                items.push(new Collectible(x, y, type));
            }
        }

        function spawnHeatHazard() {
            const config = DIFFICULTY_SETTINGS[selectedDifficulty];
            const validTiles = [];
            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    if (iceGrid[r][c].state > 0) {
                        validTiles.push({ r, c });
                    }
                }
            }

            if (validTiles.length > 0) {
                const spot = validTiles[Math.floor(Math.random() * validTiles.length)];
                hazards.push(new HeatHazard(spot.r, spot.c, config.hazardWarning));
            }
        }

        // Melting Mechanics
        function processIceMelting(delta) {
            const config = DIFFICULTY_SETTINGS[selectedDifficulty];
            meltTimer += delta;
            if (meltTimer >= meltInterval) {
                meltTimer = 0;

                if (meltInterval > 300) meltInterval -= config.meltAccelerate;

                let candidateTiles = [];
                for (let r = 0; r < GRID_ROWS; r++) {
                    for (let c = 0; c < GRID_COLS; c++) {
                        if (iceGrid[r][c].state > 0) {
                            candidateTiles.push({ r, c, state: iceGrid[r][c].state });
                        }
                    }
                }

                if (candidateTiles.length > 0) {
                    const chosen = candidateTiles[Math.floor(Math.random() * candidateTiles.length)];
                    iceGrid[chosen.r][chosen.c].state--;
                    sound.crack();

                    if (iceGrid[chosen.r][chosen.c].state === 0) {
                        const offsetX = (canvas.width - GRID_COLS * tileSize) / 2;
                        const offsetY = (canvas.height - GRID_ROWS * tileSize) / 2;
                        waterRipples.push({
                            x: offsetX + chosen.c * tileSize + tileSize / 2,
                            y: offsetY + chosen.r * tileSize + tileSize / 2,
                            radius: 5,
                            alpha: 1
                        });
                    }
                }
            }
        }

        function checkBearOnIce(p) {
            if (!p.alive) return false;
            const offsetX = (canvas.width - GRID_COLS * tileSize) / 2;
            const offsetY = (canvas.height - GRID_ROWS * tileSize) / 2;

            const gridC = Math.floor((p.x - offsetX) / tileSize);
            const gridR = Math.floor((p.y - offsetY) / tileSize);

            if (gridR < 0 || gridR >= GRID_ROWS || gridC < 0 || gridC >= GRID_COLS) {
                return false;
            }

            return iceGrid[gridR][gridC].state > 0;
        }

        function restoreIceAroundPlayer(p) {
            const offsetX = (canvas.width - GRID_COLS * tileSize) / 2;
            const offsetY = (canvas.height - GRID_ROWS * tileSize) / 2;

            const gridC = Math.floor((p.x - offsetX) / tileSize);
            const gridR = Math.floor((p.y - offsetY) / tileSize);

            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    const nr = gridR + dr;
                    const nc = gridC + dc;
                    if (nr >= 0 && nr < GRID_ROWS && nc >= 0 && nc < GRID_COLS) {
                        iceGrid[nr][nc].state = 3;
                    }
                }
            }
        }

        function drawIceGrid() {
            const offsetX = (canvas.width - GRID_COLS * tileSize) / 2;
            const offsetY = (canvas.height - GRID_ROWS * tileSize) / 2;

            if (!iceGrid || iceGrid.length === 0) return;

            for (let r = 0; r < GRID_ROWS; r++) {
                if (!iceGrid[r]) continue;
                for (let c = 0; c < GRID_COLS; c++) {
                    const tile = iceGrid[r][c];
                    if (!tile) continue;
                    const x = offsetX + c * tileSize;
                    const y = offsetY + r * tileSize;

                    if (tile.state > 0) {
                        ctx.save();
                        
                        let iceGradient = ctx.createLinearGradient(x, y, x + tileSize, y + tileSize);
                        if (tile.state === 3) {
                            iceGradient.addColorStop(0, '#e0f2fe');
                            iceGradient.addColorStop(1, '#bae6fd');
                        } else if (tile.state === 2) {
                            iceGradient.addColorStop(0, '#bae6fd');
                            iceGradient.addColorStop(1, '#7dd3fc');
                        } else {
                            iceGradient.addColorStop(0, '#7dd3fc');
                            iceGradient.addColorStop(1, '#38bdf8');
                        }

                        ctx.fillStyle = iceGradient;
                        ctx.beginPath();
                        ctx.roundRect(x + 1, y + 1, tileSize - 2, tileSize - 2, 8);
                        ctx.fill();

                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                        ctx.lineWidth = 1.5;
                        ctx.stroke();

                        if (tile.state < 3) {
                            ctx.strokeStyle = 'rgba(15, 23, 42, 0.35)';
                            ctx.lineWidth = 2;
                            ctx.beginPath();
                            ctx.moveTo(x + tileSize * 0.2, y + tileSize * 0.2);
                            ctx.lineTo(x + tileSize * 0.5, y + tileSize * 0.5);
                            ctx.lineTo(x + tileSize * 0.8, y + tileSize * 0.3);
                            if (tile.state === 1) {
                                ctx.moveTo(x + tileSize * 0.5, y + tileSize * 0.5);
                                ctx.lineTo(x + tileSize * 0.4, y + tileSize * 0.85);
                            }
                            ctx.stroke();
                        }

                        ctx.restore();
                    } else {
                        ctx.fillStyle = 'rgba(7, 89, 133, 0.2)';
                        ctx.fillRect(x, y, tileSize, tileSize);
                    }
                }
            }
        }

        function drawWaterEffects(time) {
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 2;

            for (let i = 0; i < 5; i++) {
                const yPos = (canvas.height / 5) * i + (Math.sin(time * 0.002 + i) * 10);
                ctx.beginPath();
                ctx.moveTo(0, yPos);
                ctx.quadraticCurveTo(canvas.width / 2, yPos + 15, canvas.width, yPos);
                ctx.stroke();
            }

            waterRipples.forEach((rp, index) => {
                ctx.beginPath();
                ctx.arc(rp.x, rp.y, rp.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(186, 230, 253, ${rp.alpha})`;
                ctx.lineWidth = 2;
                ctx.stroke();

                rp.radius += 0.8;
                rp.alpha -= 0.02;

                if (rp.alpha <= 0) waterRipples.splice(index, 1);
            });

            // Draw Touch Drag Indicator on Canvas
            if (mobileControlMode === 'DRAG' && touchDragActive) {
                ctx.beginPath();
                ctx.arc(touchStartPos.x, touchStartPos.y, 30, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(touchStartPos.x, touchStartPos.y);
                ctx.lineTo(touchCurrentPos.x, touchCurrentPos.y);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(touchCurrentPos.x, touchCurrentPos.y, 14, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(56, 189, 248, 0.8)';
                ctx.fill();
            }

            ctx.restore();
        }

        // Game Over Handler
        function gameOver(winnerMsg, isVictory = false) {
            const alreadyOver = (gameState === 'GAMEOVER');
            gameState = 'GAMEOVER';
            if (isVictory) {
                sound.collect();
            } else {
                sound.splash();
            }

            const remainingMs = Math.max(0, TOTAL_GAME_TIME - elapsedTime);
            const formattedTime = formatTime(remainingMs);
            let displayTitle = winnerMsg || player1Name;

            const gameOverTitle = document.getElementById('gameOverTitle');
            const gameOverSub = document.getElementById('gameOverSub');
            const gameOverEmoji = document.getElementById('gameOverEmoji');

            if (isVictory) {
                gameOverTitle.innerText = "5분 생존 성공! 🎉";
                gameOverTitle.className = "text-3xl md:text-4xl font-black text-emerald-400 mb-1";
                gameOverSub.innerText = "녹는 빙하 위에서 끝까지 버텨냈습니다!";
                gameOverEmoji.innerText = "🏆";
            } else {
                gameOverTitle.innerText = winnerMsg ? winnerMsg : "바다에 빠졌습니다!";
                gameOverTitle.className = "text-3xl md:text-4xl font-black text-red-400 mb-1";
                gameOverSub.innerText = "빙하가 녹아 바다로 빠져버렸어요 😭";
                gameOverEmoji.innerText = "🌊";
            }

            document.getElementById('finalPlayerName').innerText = displayTitle;
            document.getElementById('finalDifficulty').innerText = DIFFICULTY_SETTINGS[selectedDifficulty].label;
            document.getElementById('finalScore').innerText = score;
            document.getElementById('finalTime').innerText = formattedTime;
            document.getElementById('gameOverScreen').classList.remove('hidden');

            // 갤러리 점수 기록 (1인 모드만)
            if (!alreadyOver && gameMode === '1P' && window.GallerySDK) GallerySDK.reportScore('2026-env-polar-bear', score);
        }

        function openLeaderboard() {
            document.getElementById('leaderboardScreen').classList.remove('hidden');
            if (window.fetchLeaderboard) {
                window.fetchLeaderboard();
            }
        }

        function closeLeaderboard() {
            document.getElementById('leaderboardScreen').classList.add('hidden');
        }

        function formatTime(ms) {
            const totalSec = Math.max(0, ms / 1000);
            const mins = Math.floor(totalSec / 60).toString().padStart(2, '0');
            const secs = Math.floor(totalSec % 60).toString().padStart(2, '0');
            const tenths = Math.floor((totalSec % 1) * 10);
            return `${mins}:${secs}.${tenths}`;
        }

        // Main Loop
        let itemSpawnTimer = 0;
        let hazardSpawnTimer = 0;

        function gameLoop(timestamp) {
            if (!lastFrameTime) lastFrameTime = timestamp;
            const delta = Math.min(timestamp - lastFrameTime, 100);
            lastFrameTime = timestamp;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawWaterEffects(timestamp);

            if (gameState === 'PLAYING') {
                const diffConfig = DIFFICULTY_SETTINGS[selectedDifficulty];
                elapsedTime += delta;

                const remainingTime = Math.max(0, TOTAL_GAME_TIME - elapsedTime);
                document.getElementById('survivalTime').innerText = formatTime(remainingTime);

                // 5분 타임아웃 생존 성공 조건
                if (remainingTime <= 0) {
                    score += 1000; // 생존 성공 보너스
                    gameOver("5분 완주 성공!", true);
                    return;
                }

                player1.update(delta);
                if (gameMode === '2P') player2.update(delta);

                processIceMelting(delta);

                // Check Bear drowning
                if (player1.alive && !checkBearOnIce(player1)) {
                    player1.alive = false;
                    waterRipples.push({ x: player1.x, y: player1.y, radius: 10, alpha: 1 });
                }
                if (gameMode === '2P' && player2.alive && !checkBearOnIce(player2)) {
                    player2.alive = false;
                    waterRipples.push({ x: player2.x, y: player2.y, radius: 10, alpha: 1 });
                }

                // Win/Loss Condition Check
                if (gameMode === '1P') {
                    if (!player1.alive) gameOver();
                } else {
                    if (!player1.alive && !player2.alive) {
                        gameOver("무승부 (모두 탈락)");
                    } else if (!player1.alive) {
                        gameOver(`🏆 ${player2Name} (2P 흑곰) 승리!`);
                    } else if (!player2.alive) {
                        gameOver(`🏆 ${player1Name} (1P 북극곰) 승리!`);
                    }
                }

                itemSpawnTimer += delta;
                if (itemSpawnTimer > 3500) {
                    itemSpawnTimer = 0;
                    if (items.length < 5) spawnItem();
                }

                hazardSpawnTimer += delta;
                if (hazardSpawnTimer > diffConfig.hazardInterval) {
                    hazardSpawnTimer = 0;
                    if (hazards.length < 4) spawnHeatHazard();
                }

                // Collect Items Check
                const checkItemPickup = (p) => {
                    if (!p.alive) return;
                    items.forEach((item, index) => {
                        item.update(delta);
                        const dist = Math.hypot(p.x - item.x, p.y - item.y);
                        if (dist < p.radius + 15) {
                            if (item.type === 'FISH') {
                                score += 100;
                                p.speedBuffTimer = 4000;
                                sound.collect();
                            } else if (item.type === 'ICE_CUBE') {
                                score += 150;
                                restoreIceAroundPlayer(p);
                                sound.iceRestore();
                            }
                            document.getElementById('score').innerText = score;
                            items.splice(index, 1);
                        }
                    });
                };

                checkItemPickup(player1);
                if (gameMode === '2P') checkItemPickup(player2);

                const offsetX = (canvas.width - GRID_COLS * tileSize) / 2;
                const offsetY = (canvas.height - GRID_ROWS * tileSize) / 2;

                hazards.forEach((hz, index) => {
                    hz.update(delta);

                    if (hz.state === 'ACTIVE') {
                        const hzX = offsetX + hz.gridC * tileSize + tileSize / 2;
                        const hzY = offsetY + hz.gridR * tileSize + tileSize / 2;

                        if (player1.alive && Math.hypot(player1.x - hzX, player1.y - hzY) < tileSize * 0.4) {
                            player1.alive = false;
                        }
                        if (gameMode === '2P' && player2.alive && Math.hypot(player2.x - hzX, player2.y - hzY) < tileSize * 0.4) {
                            player2.alive = false;
                        }
                    }

                    if (hz.state === 'EXPIRED') {
                        hazards.splice(index, 1);
                    }
                });

                updateBuffUI();
            }

            drawIceGrid();

            const offsetX = (canvas.width - GRID_COLS * tileSize) / 2;
            const offsetY = (canvas.height - GRID_ROWS * tileSize) / 2;

            hazards.forEach(hz => hz.draw(offsetX, offsetY));
            items.forEach(item => item.draw());

            if (gameState === 'PLAYING' || gameState === 'PAUSED') {
                player1.draw();
                if (gameMode === '2P') player2.draw();
            }

            requestAnimationFrame(gameLoop);
        }

        // Event Listeners
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);
        document.getElementById('pauseBtn').addEventListener('click', togglePause);

        document.getElementById('leaderboardBtn').addEventListener('click', openLeaderboard);
        document.getElementById('showLeaderboardGameOverBtn').addEventListener('click', openLeaderboard);
        document.getElementById('closeLeaderboardBtn').addEventListener('click', closeLeaderboard);
        document.getElementById('closeLeaderboardBtn2').addEventListener('click', closeLeaderboard);

        // Initialize Loop on Load
        window.onload = () => {
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>

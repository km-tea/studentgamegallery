<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · 우리 반 웹앱 갤러리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
<style>main{max-width:520px}.tabs{margin-bottom:12px}</style>
</head>
<body>
<main>
  <p><a href="./">← 갤러리로 돌아가기</a></p>
  <h1 id="h1">내 앱 올리기</h1>
  <p class="sub" id="subline">가입하고 로그인하면 내가 만든 앱을 갤러리에 올릴 수 있어요.</p>

  <div id="setup" class="notice" hidden>아직 관리자 계정이 없어요. 선생님: Netlify 환경변수에 <b>ADMIN_PASSWORD</b>를 넣고 다시 배포해 주세요.</div>

  <div id="already" class="card" hidden>
    <p><b id="alreadyName"></b>(으)로 로그인되어 있어요.</p>
    <div class="row"><a id="goBtn" class="btn" href="my.html">내 앱 관리</a><button id="outBtn" class="ghost">로그아웃</button></div>
  </div>

  <div id="forms">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabLogin" aria-selected="true">로그인</button>
      <button class="tab" role="tab" id="tabSignup" aria-selected="false">처음이에요 (가입)</button>
    </div>

    <form id="loginForm" class="card">
      <label><span id="luLabel">이메일</span><input id="lu" type="text" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
      <label>비밀번호<input id="lp" type="password" autocomplete="current-password" required></label>
      <button type="submit">로그인</button>
      <p id="loginMsg" class="msg err" role="alert"></p>
      <p class="hint" id="loginHint">선생님은 위의 「교사 로그인」으로 들어오세요.</p>
    </form>

    <form id="signupForm" class="card" hidden>
      <div id="codeBox"><label>가입 코드 <span class="hint">(선생님께 받은 코드)</span><input id="sc" autocomplete="off" autocapitalize="characters" maxlength="20"></label></div>
      <label>이메일 <span class="hint">로그인할 때 써요. 선생님만 볼 수 있어요</span><input id="su" type="email" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="60" placeholder="name@gmail.com" required></label>
      <label>별명 <span class="hint">갤러리에 '만든 친구'로 보여요. 실명은 쓰지 마세요!</span><input id="sn" maxlength="12" required></label>
      <label>비밀번호 <span class="hint">6자 이상. 잊어버리면 선생님이 새로 만들어 줘요 (이메일로 찾기는 안 돼요)</span><input id="sp" type="password" autocomplete="new-password" minlength="6" required></label>
      <button type="submit">가입하고 시작하기</button>
      <p id="signupMsg" class="msg err" role="alert"></p>
    </form>
    <p id="closed" class="notice" hidden>지금은 새로 가입할 수 없어요. 선생님께 문의해 주세요.</p>
  </div>
</main>
<script src="site.js"></script>
<script>
var cfg = { signupOpen: true, codeRequired: true };
var q = new URLSearchParams(location.search);
// 교사 로그인 모드는 서버 응답을 기다리지 않고 바로 적용해요
if (q.get('role') === 'teacher') {
    // 교사 로그인 모드: 가입 탭을 숨기고 문구를 바꿔요
    $('h1').textContent = '교사 로그인'; $('subline').textContent = '선생님 전용이에요. 관리 화면으로 들어가요.';
    $('tabSignup').hidden = true; $('tabLogin').textContent = '교사 로그인'; $('luLabel').textContent = '교사 아이디 (기본: admin)';
    $('loginHint').textContent = '비밀번호는 Netlify에 등록한 ADMIN_PASSWORD(또는 바꾼 비밀번호)예요.';
}

// 로그인 뒤 돌아갈 곳: 같은 사이트 안의 .html 주소만 허용
function nextUrl(user) {
  var n = new URLSearchParams(location.search).get('next');
  if (n && /^[a-z0-9_-]+\.html(\?id=[A-Za-z0-9_.-]+)?$/i.test(n) && (n !== 'admin.html' || user.role === 'admin')) return n;
  return user.role === 'admin' ? 'admin.html' : 'my.html';
}
function tab(which) {
  var s = which === 'signup';
  $('tabLogin').setAttribute('aria-selected', String(!s)); $('tabSignup').setAttribute('aria-selected', String(s));
  $('loginForm').hidden = s; $('signupForm').hidden = !s || !cfg.signupOpen; $('closed').hidden = !(s && !cfg.signupOpen);
}
$('tabLogin').onclick = function () { tab('login'); }; $('tabSignup').onclick = function () { tab('signup'); };

function busy(form, on) { form.querySelector('button[type=submit]').disabled = on; }
$('loginForm').onsubmit = function (e) {
  e.preventDefault(); $('loginMsg').textContent = ''; busy(this, true); var f = this;
  api('POST', '/api/auth/login', { username: $('lu').value, password: $('lp').value })
    .then(function (d) { location.href = nextUrl(d.user); })
    .catch(function (er) { $('loginMsg').textContent = er.message; busy(f, false); });
};
$('signupForm').onsubmit = function (e) {
  e.preventDefault(); $('signupMsg').textContent = ''; busy(this, true); var f = this;
  api('POST', '/api/auth/signup', { code: $('sc').value, username: $('su').value, nickname: $('sn').value, password: $('sp').value })
    .then(function (d) { location.href = nextUrl(d.user); })
    .catch(function (er) { $('signupMsg').textContent = er.message; busy(f, false); });
};
$('outBtn').onclick = function () { api('POST', '/api/auth/logout', {}).then(function () { location.reload(); }); };

Promise.all([api('GET', '/api/auth/config').catch(function () { return {}; }), me().catch(function () { return null; })]).then(function (r) {
  if (r[0].signupOpen === false) cfg.signupOpen = false;
  cfg.codeRequired = r[0].codeRequired !== false;
  $('codeBox').hidden = !cfg.codeRequired; $('sc').required = cfg.codeRequired;
  if (r[0].needsSetup) $('setup').hidden = false;
  if (!cfg.signupOpen) $('tabSignup').textContent = '가입 (닫힘)';
  if (r[1]) {
    $('forms').hidden = true; $('already').hidden = false;
    $('alreadyName').textContent = r[1].nickname + ' (' + r[1].username + ')';
    $('goBtn').href = r[1].role === 'admin' ? 'admin.html' : 'my.html';
    $('goBtn').textContent = r[1].role === 'admin' ? '관리 화면으로' : '내 앱 관리';
  }
  if (q.get('tab') === 'signup' || (location.hash === '#signup' && q.get('role') !== 'teacher')) tab('signup');
});
</script>
</body>
</html>

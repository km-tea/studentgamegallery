[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# 관리 화면은 검색에 나오지 않게
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/my.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/login.html"
  [headers.values]
    X-Robots-Tag = "noindex"
